name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build Windows executable
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -platform windows/amd64

      - name: Remove older releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_tag="$GITHUB_REF_NAME"
          git ls-remote --tags --refs origin 'v*' | awk '{sub("refs/tags/", "", $2); print $2}' | while read -r tag; do
            [ "$tag" = "$current_tag" ] && continue
            gh release delete "$tag" --yes || true
            git push origin --delete "$tag"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/bin/Velin Clear.exe" --title "Velin Clear $GITHUB_REF_NAME" --generate-notes
