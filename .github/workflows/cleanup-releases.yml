name: Cleanup old releases

on:
  push:
    paths:
      - .github/workflows/cleanup-releases.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_TAG: v0.2.1
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPOSITORY}/releases" --jq '.[].id' | while read -r release_id; do
            tag_name="$(gh api "repos/${REPOSITORY}/releases/${release_id}" --jq '.tag_name')"
            if [ "${tag_name}" != "${KEEP_TAG}" ]; then
              gh api --method DELETE "repos/${REPOSITORY}/releases/${release_id}"
            fi
          done
          gh api --paginate "repos/${REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' | while read -r ref; do
            tag_name="${ref##refs/tags/}"
            if [ "${tag_name}" != "${KEEP_TAG}" ]; then
              gh api --method DELETE "repos/${REPOSITORY}/git/refs/tags/${tag_name}"
            fi
          done
